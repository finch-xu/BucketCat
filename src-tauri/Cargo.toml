[package]
name = "bucketcat"
version = "0.7.0"
description = "BucketCat — a small and beautiful object storage manager"
authors = ["虚拟世界的懒猫"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.94.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bucketcat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
# Native tray integration.
tauri = { version = "2.12.5", features = ["tray-icon"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
# Use the current HTTPS transport only. The SDK default `rustls` feature
# enables a deprecated hyper 0.14 / rustls 0.21 stack that this app never uses
# and that brings unpatched rustls-webpki advisories into the lockfile.
aws-sdk-s3 = { version = "1.157.0", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aes-gcm = "0.11.1"
hkdf = "0.13.0"
sha2 = "0.11.1"
rand = "0.10.3"
machine-uid = "0.6.0"
async-trait = "0.1.92"
uuid = { version = "1.29.0", features = ["v4"] }
percent-encoding = "2.3.2"
hmac = "0.13.0"
quick-xml = "0.42.0"
# OSS and B2 native API transport, sharing the AWS SDK HTTP/TLS stack.
rustls = "0.23.46"
hyper-rustls = "0.27.10"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["client", "client-legacy", "http1", "tokio"] }
http = "1.5.0"
http-body-util = "0.1.5"
# Counting upload body for progress reporting through SdkBody::from_body_1_x.
http-body = "1.1.0"
bytes = "1.12.1"
# HTTP Basic auth for Backblaze's native `b2_authorize_account` (see
# `provider::b2_admin`), which is the only credential scheme that API accepts.
base64 = "0.23.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tracing-appender = "0.2.5"
tauri-plugin-dialog = "2.8.4"
# Launch-at-login, invoked only from Rust commands (no frontend capability).
tauri-plugin-autostart = "2.7.0"
# Signed in-app updates, matching Tauri createUpdaterArtifacts. Invoked only
# from Rust so the frontend cannot call the plugin commands directly.
tauri-plugin-updater = "2.14.1"
# External links use the system browser, limited by capabilities/default.json
# to the configured GitHub release/repository URLs.
tauri-plugin-opener = "2.7.2"

[dev-dependencies]
tempfile = "3.27.0"
# Matching `capabilities/default.json`'s `opener:allow-open-url` globs against
# `updater_source::SOURCES` (see `every_release_page_is_within_the_opener_scope`)
# with the very crate `tauri-plugin-opener` uses for that check, so the test
# cannot drift from the runtime rule. Already resolved via `tauri`, so it adds
# no lock entry.
glob = "0.3.4"
tokio = { version = "1.54.1", features = ["test-util", "macros", "rt-multi-thread"] }
# Same SHA-256 implementation as production for MinIO end-to-end hash checks.
sha2 = "0.11.1"

