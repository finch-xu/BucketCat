[package]
name = "bucketcat"
version = "0.1.0"
description = "BucketCat — a small and beautiful object storage manager"
authors = ["BucketCat contributors"]
edition = "2021"
rust-version = "1.94.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bucketcat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
aws-sdk-s3 = "1.137.0"
aes-gcm = "0.11.0"
hkdf = "0.13.0"
sha2 = "0.11.0"
rand = "0.10.2"
machine-uid = "0.6.0"
async-trait = "0.1.91"
uuid = { version = "1.24.0", features = ["v4"] }
percent-encoding = "2.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tracing-appender = "0.2.5"
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["test-util", "macros", "rt-multi-thread"] }
# Already resolved at 0.11.0 in the main dependency tree (see `[dependencies]`
# above and Cargo.lock), so adding it here as a dev-dependency for the MinIO
# end-to-end hash checks pulls no new crate and no extra compile.
sha2 = "0.11.0"

