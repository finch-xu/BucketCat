[package]
name = "bucketcat"
version = "0.1.0"
description = "BucketCat — a small and beautiful object storage manager"
authors = ["虚拟世界的懒猫"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.94.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bucketcat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` costs nothing here: `tray-icon` 0.24.1 and `muda` 0.19.3 are
# already resolved in Cargo.lock as optional dependencies of `tauri` itself,
# so turning the feature on adds zero new lock entries.
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
aws-sdk-s3 = "1.137.0"
aes-gcm = "0.11.0"
hkdf = "0.13.0"
sha2 = "0.11.0"
rand = "0.10.2"
machine-uid = "0.6.0"
async-trait = "0.1.91"
uuid = { version = "1.24.0", features = ["v4"] }
percent-encoding = "2.3"
hmac = "0.13.0"
quick-xml = "0.41"
# --- OSS native ListBuckets transport (see `provider::oss_admin`) ---
#
# Deliberately NOT `reqwest`: `reqwest` 0.13.4 (as already resolved in
# Cargo.lock, pulled in transitively as a *target-specific* dependency of
# `tauri` for Android/iOS only) cannot get TLS support without its `rustls`
# or `rustls-no-provider` feature, and BOTH of those unconditionally require
# the `rustls-platform-verifier` optional dependency -- confirmed by actually
# enabling each and inspecting `Cargo.lock`: it adds 7 new `[[package]]`
# nodes (`rustls-platform-verifier`, `rustls-platform-verifier-android`,
# `jni`, `jni-macros`, `simd_cesu8`, `simdutf8`, `webpki-root-certs`), none
# of which exist in the lock today. That violates this task's hard
# "zero new dependency-graph nodes" requirement. The crates below give the
# same capability (build one signed HTTPS GET, read the response) using only
# packages already resolved in Cargo.lock -- `hyper-rustls` 0.27.9 is already
# pulled in by `aws-smithy-http-client` (aws-sdk-s3's own transport), with
# `rustls-native-certs` and `aws-lc-rs` already active on that exact
# `rustls` 0.23.42 instance -- so promoting these to direct dependencies adds
# zero new lock entries (verified: `git diff Cargo.lock | grep -c '^+name = '`
# is 0).
rustls = "0.23"
hyper-rustls = "0.27"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tracing-appender = "0.2.5"
tauri-plugin-dialog = "2"
# Launch-at-login. Unlike every other dependency here this one does add lock
# entries (`auto-launch` and its own deps) -- the alternative was hand-rolling
# a LaunchAgent plist, a HKCU\...\Run registry write and an XDG .desktop file,
# of which only the macOS third could be tested from this machine. Used from
# Rust only (see `commands::settings::set_autostart`): no npm package, and no
# capability entry, since the frontend never invokes the plugin's own
# commands.
tauri-plugin-autostart = "2"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["test-util", "macros", "rt-multi-thread"] }
# Already resolved at 0.11.0 in the main dependency tree (see `[dependencies]`
# above and Cargo.lock), so adding it here as a dev-dependency for the MinIO
# end-to-end hash checks pulls no new crate and no extra compile.
sha2 = "0.11.0"

